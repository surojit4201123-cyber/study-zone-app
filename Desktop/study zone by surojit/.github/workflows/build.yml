name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Generate TWA Project Non-Interactively
      run: |
        cd "Desktop/study zone by surojit"
        npx @bubblewrap/cli init --manifest=manifest.json --directory=. --manifestDir=. --skipValidation || true

    - name: Build APK
      run: |
        cd "Desktop/study zone by surojit"
        bubblewrap build --skipSigning || true

    - name: Find and Move APK
      run: |
        find "Desktop/study zone by surojit" -name "*.apk" -exec cp {} . \;

    - name: Upload Generated APK
      uses: actions/upload-artifact@v4
      with:
        name: App-Release-APK
        path: "*.apk"